name = "lobby-relay"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# L'app téléphone (../phone) est servie en HTTPS par le relais
[assets]
directory = "../phone"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Directory"]

[vars]
VAPID_SUBJECT = "mailto:lobby@example.com"
