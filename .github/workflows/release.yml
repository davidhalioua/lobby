# Publie Lobby.exe automatiquement : il suffit de changer "version" dans companion/package.json
# et de pousser sur main. Si cette version n'a pas encore de release, GitHub construit l'exe,
# crée le tag vX.Y.Z et la release. Les Lobby installés se mettent à jour tout seuls dans les 6 h.
name: Release
on:
  push:
    branches: [main]
    paths: ['companion/**', 'phone/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - name: Version à publier
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $V existe déjà : rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.v.outputs.skip != 'true'
      - name: Dépôt de mise à jour et adresse du relais
        if: steps.v.outputs.skip != 'true'
        env:
          RELAY_URL: ${{ vars.LOBBY_RELAY_URL }}
        run: |
          node -e "const f='package.json',p=require('./'+f);p.lobby={...p.lobby,updateRepo:process.env.GITHUB_REPOSITORY,relayUrl:process.env.RELAY_URL||p.lobby?.relayUrl||''};require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - run: npm run build
        if: steps.v.outputs.skip != 'true'
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lobby ${{ steps.v.outputs.tag }}
          files: companion/dist/Lobby.exe
          generate_release_notes: true
